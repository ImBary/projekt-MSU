name: Testowanie kodu
on:
    push:
        branches: [ main ]
        paths-ignore:
            -'**/*.md'
    pull_request:
        branches: [ main ]
        paths-ignore:
            -'**/*.md'

jobs:
    testy:
        # runs on - określa środowisko, w którym zostaną wykonane testy
        runs-on: ubuntu-24.04
        # steps - jakie kroki sa do wykonania
        steps:
            -
                name: Pobiranie kodu
                uses: actions/checkout@v4
                # uses - oznacza wykorzystatnie akcji github actions

            -
                name: Instalacja pythona
                uses: actions/setup-python@v5
                with:
                    python-version: '3.12'

            -
                name: Instalacja zaleznosci
                run: |
                    python -m pip install --upgrade pip
                    python -m pip install -r requirements.txt
            -
                name: Uruchamianie testów
                run: pytest -m pytest -v